spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=INFO
nana.telegram.api-base=https://api.telegram.org
nana.telegram.poll-timeout-seconds=30
nana.telegram.connect-timeout-seconds=10
nana.ollama.base-url=http://localhost:11434
nana.ollama.model=qwen2.5:7b
nana.ollama.timeout-seconds=180
nana.context.max-messages=16
nana.context.max-age-minutes=120
nana.rate-limit.group-seconds=3
nana.response.max-chars=1800
